name: Обновить стихи из таблицы

on:
  schedule:
    - cron: "0 1 * * *"   # каждый день в 01:00 UTC
  workflow_dispatch:       # можно запустить вручную во вкладке Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: Скачать данные из закрытой таблицы
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT" ]; then echo "Доступ к таблице ещё не настроен, пропускаю"; exit 0; fi
          python scripts/build_data.py
      - name: Сохранить, если что-то изменилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data.json data-sk.json
          git diff --cached --quiet || { git commit -m "Обновить стихи из таблицы"; git push; }
