<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ВРЕМЕННОЕ НАЗВАНИЕ: замените, когда придумаете своё (здесь и в <h1> ниже) -->
<title>Что Библия говорит о грехе</title>
<meta name="description" content="Список грехов и стихи Библии о каждом из них. Синодальный перевод.">
<meta name="theme-color" content="#1b2420">
<link rel="preload" href="atziluth-title.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a66;
    --line: #e7e4dd;
    --accent: #7a5c2e;
    --accent-soft: #f3ece0;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  /* Название: RU — Atziluth Script (в файле только буквы русского названия), SK — Great Vibes (в Atziluth нет Č и плохое í). */
  @font-face { font-family: "Atziluth"; src: url("atziluth-title.woff2") format("woff2"); font-display: swap; }
  html[lang="sk"] h1 { font-family: "Great Vibes", cursive; }
  body {
    margin: 0; background: #1b2420; color: var(--text);
    font: 17px/1.55 Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  /* Фон: горы для ПК, лес для телефона; обрезается по краям (cover). Отдельный слой, т.к. fixed-фон не работает на iPhone. */
  .bg { position: fixed; inset: 0; z-index: -2; background: #1b2420 url("fon-pc.jpg") center / cover no-repeat; }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(10,14,12,.55), rgba(10,14,12,.72)); }
  @media (max-aspect-ratio: 1/1), (max-width: 700px) { .bg { background-image: url("fon-telefon.jpg"); } }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header.top { margin: 20px 0 12px; padding: 20px 20px 18px; background: rgba(8,12,10,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-radius: 18px; }
  h1 { font-family: "Atziluth", cursive; font-size: 50px; line-height: 0.95; margin: 0 0 6px; font-weight: 400; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .sub { color: rgba(255,255,255,.85); font-size: 15px; margin: 0; }
  @media (min-width: 700px) { h1 { font-size: 68px; } header.top { margin: 40px 0 16px; padding: 32px 36px 28px; } }

  .bar {
    padding: 4px 0 6px;
  }
  .search { position: relative; }
  .search input {
    width: 100%; font: inherit; font-size: 17px; padding: 12px 44px 12px 14px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border: 0; background: none; color: var(--muted);
    font-size: 22px; cursor: pointer; border-radius: 50%; display: none;
  }
  .clear.show { display: block; }
  .chips {
    display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 0; padding: 0 16px 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font: inherit; font-size: 14px; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .chip { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); color: #fff; }
  .chip[aria-pressed="true"] { background: #fff; border-color: #fff; color: var(--text); }

  main { padding: 8px 0 48px; }
  .cat { margin-top: 22px; }
  .cat h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,.8);
    margin: 0 0 8px; font-weight: 600;
  }
  .list { background: rgba(8,12,10,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 0; box-shadow: 0 6px 24px rgba(0,0,0,.3); border-radius: var(--radius); overflow: hidden; }
  .sin + .sin { border-top: 1px solid rgba(255,255,255,.1); }
  .row { display: flex; align-items: stretch; }
  .row > .open-btn { flex: 1; min-width: 0; }
  .help { flex: 0 0 auto; width: 48px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0 4px 0 0; }
  .help span { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.55); color: rgba(255,255,255,.85); font: 700 15px/23px Arial, sans-serif; text-align: center; }
  .help[aria-pressed="true"] span { background: #e8c98a; border-color: #e8c98a; color: #1b2420; }
  .help:focus-visible { outline: 2px solid #e8c98a; outline-offset: -4px; }
  .explain { margin: 6px 14px 4px; padding: 12px 14px; border-radius: 10px; background: rgba(232,201,138,.12); color: rgba(255,255,255,.92); font-size: 15px; }
  .explain p { margin: 0; }
  .explain p + p { margin-top: 8px; }
  .explain b { color: #e8c98a; display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  header.top { position: relative; }
  .lang { position: absolute; top: 14px; right: 14px; display: flex; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; overflow: hidden; }
  .lang button { font: 700 13px/1 Arial, sans-serif; letter-spacing: .04em; padding: 8px 11px; border: 0; background: transparent; color: rgba(255,255,255,.8); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: #fff; color: #1b2420; }
  .lang button:focus-visible { outline: 2px solid #e8c98a; outline-offset: -2px; }
  @media (max-width: 699px) { .lang { position: static; width: max-content; margin: -6px -6px 2px auto; } }
  @media (min-width: 700px) { h1 { padding-right: 96px; } .lang { top: 22px; right: 22px; } }
  .tabs { display: flex; gap: 8px; margin-top: 14px; }
  .tab { font: inherit; font-size: 15px; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; text-decoration: none; }
  .tab[aria-current="page"] { background: #fff; color: #1b2420; border-color: #fff; }
  .dict { padding: 16px 14px; }
  .dict + .dict { border-top: 1px solid rgba(255,255,255,.1); }
  .dict h3 { margin: 0; font-size: 18px; font-weight: 700; color: #fff; }
  .dict .dcat { font-size: 13px; color: rgba(255,255,255,.55); margin: 2px 0 8px; }
  .dict .explain { margin: 0 0 10px; }
  .dict a.go { color: #e8c98a; font-size: 14px; font-weight: 700; text-decoration: none; }
  .letter { font-size: 22px; font-weight: 700; color: #fff; margin: 22px 0 8px; }
  .sin .open-btn {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    font: inherit; font-size: 17px; color: #fff; background: none; border: 0;
    padding: 14px 14px; min-height: 52px; cursor: pointer;
  }
  .sin .open-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sin .name { flex: 1; font-weight: 700; }
  .sin .count { color: rgba(255,255,255,.6); font-size: 14px; font-variant-numeric: tabular-nums; }
  .sin .arrow { width: 10px; height: 10px; border-right: 2px solid rgba(255,255,255,.7); border-bottom: 2px solid rgba(255,255,255,.7);
    transform: rotate(45deg); margin: -4px 4px 0 0; transition: transform .2s; }
  .sin.open .arrow { transform: rotate(-135deg); margin-top: 4px; }
  .sin.open > .row { background: rgba(255,255,255,.08); }
  .verses { padding: 4px 14px 10px; }
  .verse { padding: 12px 0; }
  .verse + .verse { border-top: 1px dashed rgba(255,255,255,.14); }
  a.ref { text-decoration: none; display: inline-block; padding: 2px 0; }
  a.ref:active { opacity: .6; }
  .ref { display: block; font-size: 14px; font-weight: 600; color: #e8c98a; margin-bottom: 2px; }
  .text { margin: 0; color: rgba(255,255,255,.92); }
  mark { background: rgba(232,201,138,.45); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { color: rgba(255,255,255,.85); text-align: center; padding: 40px 0; }
  footer { color: rgba(255,255,255,.7); font-size: 13px; padding: 0 0 32px; }
  @media (prefers-reduced-motion: reduce) { .sin .arrow { transition: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="lang" role="group" aria-label="Язык / Jazyk">
      <button type="button" data-lang="ru" lang="ru">RU</button><button type="button" data-lang="sk" lang="sk">SK</button>
    </div>
    <h1 data-t="title">Что Библия говорит о грехе</h1>
    <p class="sub" data-t="sub">Стихи Ветхого и Нового Завета. Синодальный перевод.</p>
    <nav class="tabs" aria-label="Разделы" data-t-label="sections">
      <a class="tab" href="#" id="tab-main" aria-current="page" data-t="tabMain">Грехи и стихи</a>
      <a class="tab" href="#slovar" id="tab-dict" data-t="tabDict">Словарь</a>
    </nav>
  </header>

  <div class="bar" id="bar">
    <div class="search">
      <input id="q" type="search" placeholder="Найти грех, например «ложь»" autocomplete="off" aria-label="Поиск греха" data-t-ph="ph" data-t-label="searchLabel">
      <button class="clear" id="clear" aria-label="Очистить поиск" data-t-label="clear">×</button>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Категории" data-t-label="cats"></div>
  </div>

  <main id="main"><p class="empty">Загрузка…</p></main>
  <footer id="foot"></footer>
</div>

<script>
(function () {
  var main = document.getElementById('main');
  var chipsEl = document.getElementById('chips');
  var q = document.getElementById('q');
  var clearBtn = document.getElementById('clear');
  var data = null, activeCat = null, lang = 'ru', cache = {};

  // Тексты интерфейса (лист «Rozhranie SK»).
  var T = {
    ru: { title: 'Что Библия говорит о грехе', sub: 'Стихи Ветхого и Нового Завета. Синодальный перевод.',
      desc: 'Список грехов и стихи Библии о каждом из них. Синодальный перевод.',
      tabMain: 'Грехи и стихи', tabDict: 'Словарь', sections: 'Разделы', ph: 'Найти грех, например «ложь»',
      searchLabel: 'Поиск греха', clear: 'Очистить поиск', cats: 'Категории', all: 'Все', loading: 'Загрузка…',
      error: 'Не удалось загрузить данные. Обновите страницу.', empty: 'Ничего не нашлось. Попробуйте другое слово.',
      meaning: 'Что это значит', example: 'Пример из жизни', help: 'Что значит «%»', verses: 'Стихи',
      v: ['стих', 'стиха', 'стихов'], sins: '% грехов', tr: 'Текст: Синодальный перевод.', upd: 'Обновлено %.' },
    sk: { title: 'Čo hovorí Biblia o hriechu', sub: 'Verše zo Starej a Novej zmluvy. Roháčkov preklad.',
      desc: 'Zoznam hriechov a biblické verše o každom z nich. Roháčkov preklad.',
      tabMain: 'Hriechy a verše', tabDict: 'Slovník', sections: 'Sekcie', ph: 'Nájdi hriech, napríklad „lož“',
      searchLabel: 'Hľadať hriech', clear: 'Vymazať hľadanie', cats: 'Kategórie', all: 'Všetky', loading: 'Načítava sa…',
      error: 'Údaje sa nepodarilo načítať. Obnovte stránku.', empty: 'Nič sa nenašlo. Skúste iné slovo.',
      meaning: 'Čo to znamená', example: 'Príklad zo života', help: 'Čo znamená „%“', verses: 'Verše',
      v: ['verš', 'verše', 'veršov'], sins: '% hriechov', tr: 'Text: Roháčkov preklad.', upd: 'Aktualizované %.' }
  };
  function t(k) { return T[lang][k]; }

  // Поиск без учёта регистра, ё/е и словацких диакритик; длина строки сохраняется для подсветки.
  function norm(s) {
    return s.toLowerCase().split('').map(function (ch) {
      return ch === 'ё' ? 'е' : (ch.normalize ? ch.normalize('NFD').charAt(0) : ch);
    }).join('');
  }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function plural(n) {
    var f = t('v');
    if (lang === 'sk') return n === 1 ? f[0] : (n >= 2 && n <= 4 ? f[1] : f[2]);
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return f[0];
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return f[1];
    return f[2];
  }
  function highlight(name, query) {
    if (!query) return esc(name);
    var i = norm(name).indexOf(query);
    if (i < 0) return esc(name);
    return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + query.length)) + '</mark>' + esc(name.slice(i + query.length));
  }

  // Ссылка открывает стих в приложении Bible (YouVersion), если оно установлено, иначе на bible.com. 400 = Синодальный перевод.
  var BOOKS = {"Быт.": "GEN", "Исх.": "EXO", "Лев.": "LEV", "Чис.": "NUM", "Втор.": "DEU", "Нав.": "JOS", "Суд.": "JDG", "1 Цар.": "1SA", "2 Цар.": "2SA", "3 Цар.": "1KI", "4 Цар.": "2KI", "1 Пар.": "1CH", "2 Пар.": "2CH", "Езд.": "EZR", "Неем.": "NEH", "Иов.": "JOB", "Пс.": "PSA", "Притч.": "PRO", "Еккл.": "ECC", "Ис.": "ISA", "Иер.": "JER", "Плач.": "LAM", "Иез.": "EZK", "Дан.": "DAN", "Ос.": "HOS", "Иоил.": "JOL", "Ам.": "AMO", "Авд.": "OBA", "Ион.": "JON", "Мих.": "MIC", "Наум.": "NAM", "Авв.": "HAB", "Соф.": "ZEP", "Зах.": "ZEC", "Мал.": "MAL", "Мф.": "MAT", "Мк.": "MRK", "Лк.": "LUK", "Ин.": "JHN", "Деян.": "ACT", "Иак.": "JAS", "1 Пет.": "1PE", "2 Пет.": "2PE", "1 Ин.": "1JN", "2 Ин.": "2JN", "3 Ин.": "3JN", "Иуд.": "JUD", "Рим.": "ROM", "1 Кор.": "1CO", "2 Кор.": "2CO", "Гал.": "GAL", "Еф.": "EPH", "Флп.": "PHP", "Кол.": "COL", "1 Фес.": "1TH", "2 Фес.": "2TH", "1 Тим.": "1TI", "2 Тим.": "2TI", "Тит.": "TIT", "Евр.": "HEB", "Откр.": "REV"};
  function verseUrl(v) {
    if (v[2]) return v[2]; // словацкий: глава на mojabiblia.sk
    var ref = v[0];
    var m = /^(.+?)\s*(\d+):(\d+(?:-\d+)?)$/.exec(ref);
    if (!m || !BOOKS[m[1]]) return null;
    return 'https://www.bible.com/bible/400/' + BOOKS[m[1]] + '.' + m[2] + '.' + m[3] + '.SYNO';
  }

  function renderChips() {
    var html = '<button class="chip" data-cat="" aria-pressed="' + (activeCat === null) + '">' + t('all') + '</button>';
    data.categories.forEach(function (c, i) {
      html += '<button class="chip" data-cat="' + i + '" aria-pressed="' + (activeCat === i) + '">' + esc(c.name) + '</button>';
    });
    chipsEl.innerHTML = html;
  }

  function render() {
    var query = norm(q.value.trim());
    clearBtn.classList.toggle('show', q.value.length > 0);
    var html = '';
    data.categories.forEach(function (c, ci) {
      if (activeCat !== null && activeCat !== ci) return;
      var items = '';
      c.sins.forEach(function (s, si) {
        if (query && norm(s.name).indexOf(query) < 0) return;
        var n = s.verses.length;
        items += '<div class="sin" data-c="' + ci + '" data-s="' + si + '">' +
          '<div class="row"><button class="open-btn" aria-expanded="false"><span class="name">' + highlight(s.name, query) + '</span>' +
          '<span class="count">' + n + ' ' + plural(n) + '</span><span class="arrow" aria-hidden="true"></span></button>' +
          (s.meaning ? '<button class="help" aria-pressed="false" aria-label="' + esc(t('help').replace('%', s.name)) + '"><span>?</span></button>' : '') +
          '</div></div>';
      });
      if (items) html += '<section class="cat"><h2>' + esc(c.name) + '</h2><div class="list">' + items + '</div></section>';
    });
    main.innerHTML = html || '<p class="empty">' + t('empty') + '</p>';
  }

  function explainHtml(s) {
    return '<div class="explain"><p><b>' + t('meaning') + '</b>' + esc(s.meaning) + '</p>' +
      (s.example ? '<p><b>' + t('example') + '</b>' + esc(s.example) + '</p>' : '') + '</div>';
  }

  function toggleHelp(sinEl, helpBtn) {
    var s = data.categories[+sinEl.dataset.c].sins[+sinEl.dataset.s];
    if (!sinEl.classList.contains('open')) toggle(sinEl);
    var box = sinEl.querySelector('.explain');
    var on = helpBtn.getAttribute('aria-pressed') !== 'true';
    helpBtn.setAttribute('aria-pressed', on);
    if (on && !box) sinEl.querySelector('.row').insertAdjacentHTML('afterend', explainHtml(s));
    else if (box) box.hidden = !on;
  }

  function toggle(sinEl) {
    var btn = sinEl.querySelector('.open-btn');
    var open = sinEl.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
    var box = sinEl.querySelector('.verses');
    if (open && !box) {
      var s = data.categories[+sinEl.dataset.c].sins[+sinEl.dataset.s];
      var html = '<div class="verses">';
      s.verses.forEach(function (v) {
        var u = verseUrl(v);
        html += '<div class="verse">' + (u ? '<a class="ref" href="' + u + '" rel="noopener">' + esc(v[0]) + ' ↗\uFE0E</a>' : '<span class="ref">' + esc(v[0]) + '</span>') + '<p class="text">' + esc(v[1]) + '</p></div>';
      });
      sinEl.insertAdjacentHTML('beforeend', html + '</div>');
    } else if (box) {
      box.hidden = !open;
    }
    var ex = sinEl.querySelector('.explain'), hb = sinEl.querySelector('.help');
    if (!open && ex) { ex.hidden = true; hb.setAttribute('aria-pressed', 'false'); }
  }

  function renderDict() {
    var all = [];
    data.categories.forEach(function (c, ci) { c.sins.forEach(function (s, si) { if (s.meaning) all.push({ s: s, c: c.name, ci: ci, si: si }); }); });
    all.sort(function (a, b) { return a.s.name.localeCompare(b.s.name, lang); });
    var html = '', letter = '', group = '';
    all.forEach(function (x) {
      var L = x.s.name.charAt(0).toUpperCase();
      if (L !== letter) {
        if (group) html += group + '</div>';
        letter = L; html += '<h2 class="letter">' + esc(L) + '</h2>'; group = '<div class="list">';
      }
      group += '<article class="dict"><h3>' + esc(x.s.name) + '</h3><p class="dcat">' + esc(x.c) + '</p>' + explainHtml(x.s) +
        '<a class="go" href="#" data-c="' + x.ci + '" data-s="' + x.si + '">' + t('verses') + ': ' + x.s.verses.length + ' ' + plural(x.s.verses.length) + ' →</a></article>';
    });
    if (group) html += group + '</div>';
    main.innerHTML = html;
  }

  var bar = document.getElementById('bar');
  function route() {
    var dict = location.hash === '#slovar';
    document.getElementById('tab-main').toggleAttribute('aria-current', !dict);
    document.getElementById('tab-dict').toggleAttribute('aria-current', dict);
    if (dict) document.getElementById('tab-dict').setAttribute('aria-current', 'page'); else document.getElementById('tab-main').setAttribute('aria-current', 'page');
    bar.hidden = dict;
    if (!data) return;
    if (dict) renderDict(); else render();
  }
  window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });

  main.addEventListener('click', function (e) {
    var go = e.target.closest('a.go');
    if (go) {
      e.preventDefault();
      var ci = +go.dataset.c, si = +go.dataset.s;
      q.value = ''; activeCat = ci;
      history.pushState(null, '', location.pathname); route(); renderChips();
      var el = main.querySelector('.sin[data-c="' + ci + '"][data-s="' + si + '"]');
      if (el) { toggle(el); el.scrollIntoView({ block: 'start' }); }
      return;
    }
    var help = e.target.closest('.help');
    if (help) { toggleHelp(help.closest('.sin'), help); return; }
    var btn = e.target.closest('.open-btn');
    if (btn) toggle(btn.closest('.sin'));
  });
  chipsEl.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    activeCat = chip.dataset.cat === '' ? null : +chip.dataset.cat;
    renderChips(); render();
    chip = chipsEl.querySelector('[aria-pressed="true"]');
    if (chip && chip.scrollIntoView) chip.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
  q.addEventListener('input', render);
  clearBtn.addEventListener('click', function () { q.value = ''; render(); q.focus(); });

  function applyTexts() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelector('meta[name="description"]').setAttribute('content', t('desc'));
    [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t(el.dataset.t); });
    [].forEach.call(document.querySelectorAll('[data-t-label]'), function (el) { el.setAttribute('aria-label', t(el.dataset.tLabel)); });
    [].forEach.call(document.querySelectorAll('[data-t-ph]'), function (el) { el.placeholder = t(el.dataset.tPh); });
    [].forEach.call(document.querySelectorAll('.lang button'), function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang); });
  }

  function footer(d) {
    var total = 0, sins = 0;
    d.categories.forEach(function (c) { sins += c.sins.length; c.sins.forEach(function (s) { total += s.verses.length; }); });
    document.getElementById('foot').textContent = t('sins').replace('%', sins) + ', ' + total + ' ' + plural(total) +
      '. ' + t('tr') + ' ' + t('upd').replace('%', d.updated.split('-').reverse().join('.'));
  }

  function setLang(l, remember) {
    lang = l;
    if (remember) { try { localStorage.setItem('lang', l); } catch (e) {} }
    applyTexts();
    if (!data) main.innerHTML = '<p class="empty">' + t('loading') + '</p>';
    var file = l === 'sk' ? 'data-sk.json' : 'data.json';
    var p = cache[l] || (cache[l] = fetch(file, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }));
    p.then(function (d) {
      if (lang !== l) return;
      data = d;
      renderChips(); route(); footer(d);
    }).catch(function () { delete cache[l]; main.innerHTML = '<p class="empty">' + t('error') + '</p>'; });
  }

  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (b && b.dataset.lang !== lang) setLang(b.dataset.lang, true);
  });

  // Язык: сохранённый выбор, иначе язык телефона (словацкий или чешский -> SK), иначе русский.
  var saved = null;
  try { saved = localStorage.getItem('lang'); } catch (e) {}
  var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
  setLang(saved === 'ru' || saved === 'sk' ? saved : (/^(sk|cs)/i.test(nav) ? 'sk' : 'ru'), false);
})();
</script>
</body>
</html>
